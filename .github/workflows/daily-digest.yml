name: 每日开源日报

on:
  schedule:
    # 北京时间每天 09:00。GitHub 用 UTC，中国无夏令时。
    - cron: "0 1 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  send:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: 检查飞书配置
        env:
          FEISHU_APP_ID: ${{ secrets.FEISHU_APP_ID }}
          FEISHU_WEBHOOK_URL: ${{ secrets.FEISHU_WEBHOOK_URL }}
        run: |
          if [ -z "$FEISHU_APP_ID" ] && [ -z "$FEISHU_WEBHOOK_URL" ]; then
            echo "::error::请配置 FEISHU_APP_ID + FEISHU_APP_SECRET（开放平台应用），或 FEISHU_WEBHOOK_URL（自定义机器人）。"
            exit 1
          fi
      - name: 推送开源日报到飞书
        env:
          GITHUB_TOKEN: ${{ secrets.OSS_GITHUB_TOKEN || secrets.GITHUB_TOKEN }}
          GITHUB_ORG: ${{ vars.GITHUB_ORG }}
          GITHUB_REPOS: ${{ vars.GITHUB_REPOS }}
          FEISHU_APP_ID: ${{ secrets.FEISHU_APP_ID }}
          FEISHU_APP_SECRET: ${{ secrets.FEISHU_APP_SECRET }}
          FEISHU_CHAT_ID: ${{ secrets.FEISHU_CHAT_ID }}
          FEISHU_WEBHOOK_URL: ${{ secrets.FEISHU_WEBHOOK_URL }}
          FEISHU_WEBHOOK_SECRET: ${{ secrets.FEISHU_WEBHOOK_SECRET }}
          DIGEST_TITLE: ${{ vars.DIGEST_TITLE }}
          LOOKBACK_HOURS: ${{ vars.LOOKBACK_HOURS }}
          SCHEDULE_TZ: Asia/Shanghai
        run: npm run digest:send
