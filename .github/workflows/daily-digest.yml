name: 每日开源日报

on:
  schedule:
    # 北京时间 08:05–08:55，约每 10 分钟试一次。
    # GitHub 用 UTC，中国无夏令时。同一天只成功发送一次。
    - cron: "5 0 * * *" # 08:05
    - cron: "15 0 * * *" # 08:15
    - cron: "25 0 * * *" # 08:25
    - cron: "35 0 * * *" # 08:35
    - cron: "45 0 * * *" # 08:45
    - cron: "55 0 * * *" # 08:55
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  send:
    runs-on: ubuntu-latest
    steps:
      - name: 今天已成功发送则跳过
        id: guard
        if: github.event_name == 'schedule'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 <<'PY'
          import json
          import os
          import urllib.error
          import urllib.request
          from datetime import datetime, timedelta, timezone

          token = os.environ["GH_TOKEN"]
          repo = os.environ["GITHUB_REPOSITORY"]
          current_id = int(os.environ["GITHUB_RUN_ID"])
          output_path = os.environ["GITHUB_OUTPUT"]

          def api(url):
              req = urllib.request.Request(
                  url,
                  headers={
                      "Authorization": f"Bearer {token}",
                      "Accept": "application/vnd.github+json",
                      "User-Agent": "oss-digest-guard",
                      "X-GitHub-Api-Version": "2022-11-28",
                  },
              )
              with urllib.request.urlopen(req) as response:
                  return json.loads(response.read())

          already_sent = False
          try:
              shanghai = timezone(timedelta(hours=8))
              today_start = datetime.now(shanghai).replace(
                  hour=0, minute=0, second=0, microsecond=0
              )
              start_utc = today_start.astimezone(timezone.utc)
              runs = api(
                  f"https://api.github.com/repos/{repo}/actions/workflows/daily-digest.yml/runs?per_page=30"
              )
              for run in runs.get("workflow_runs", []):
                  if run["id"] == current_id or run.get("conclusion") != "success":
                      continue
                  created = datetime.fromisoformat(
                      run["created_at"].replace("Z", "+00:00")
                  )
                  if created < start_utc:
                      continue
                  jobs = api(run["jobs_url"])
                  for job in jobs.get("jobs", []):
                      for step in job.get("steps", []):
                          if (
                              step.get("name") == "推送开源日报到飞书"
                              and step.get("conclusion") == "success"
                          ):
                              already_sent = True
                              print(f"今天已经发送过：{run['html_url']}")
                              break
                      if already_sent:
                          break
                  if already_sent:
                      break
          except (urllib.error.URLError, TimeoutError, json.JSONDecodeError) as error:
              print(f"检查历史运行失败，继续尝试发送：{error}")
              already_sent = False

          with open(output_path, "a", encoding="utf-8") as handle:
              handle.write(f"already_sent={'true' if already_sent else 'false'}\n")
          print("already_sent", already_sent)
          PY

      - name: 跳过重复发送
        if: steps.guard.outputs.already_sent == 'true'
        run: echo "今天已经成功推送到飞书，跳过这个时间点。"

      - uses: actions/checkout@v4
        if: steps.guard.outputs.already_sent != 'true'
      - uses: actions/setup-node@v4
        if: steps.guard.outputs.already_sent != 'true'
        with:
          node-version: 22
          cache: npm
      - run: npm ci
        if: steps.guard.outputs.already_sent != 'true'
      - name: 检查飞书配置
        if: steps.guard.outputs.already_sent != 'true'
        env:
          FEISHU_APP_ID: ${{ secrets.FEISHU_APP_ID }}
          FEISHU_WEBHOOK_URL: ${{ secrets.FEISHU_WEBHOOK_URL }}
        run: |
          if [ -z "$FEISHU_APP_ID" ] && [ -z "$FEISHU_WEBHOOK_URL" ]; then
            echo "::error::请配置 FEISHU_APP_ID + FEISHU_APP_SECRET（开放平台应用），或 FEISHU_WEBHOOK_URL（自定义机器人）。"
            exit 1
          fi
      - name: 推送开源日报到飞书
        if: steps.guard.outputs.already_sent != 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.OSS_GITHUB_TOKEN || secrets.GITHUB_TOKEN }}
          OSS_ORG: ${{ vars.OSS_ORG }}
          OSS_REPOS: ${{ vars.OSS_REPOS }}
          GITHUB_ORG: ${{ vars.OSS_ORG }}
          GITHUB_REPOS: ${{ vars.OSS_REPOS }}
          FEISHU_APP_ID: ${{ secrets.FEISHU_APP_ID }}
          FEISHU_APP_SECRET: ${{ secrets.FEISHU_APP_SECRET }}
          FEISHU_CHAT_ID: ${{ secrets.FEISHU_CHAT_ID }}
          FEISHU_WEBHOOK_URL: ${{ secrets.FEISHU_WEBHOOK_URL }}
          FEISHU_WEBHOOK_SECRET: ${{ secrets.FEISHU_WEBHOOK_SECRET }}
          DIGEST_TITLE: ${{ vars.DIGEST_TITLE }}
          LOOKBACK_HOURS: ${{ vars.LOOKBACK_HOURS }}
          SCHEDULE_TZ: Asia/Shanghai
        run: npm run digest:send
